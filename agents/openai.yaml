interface:
  display_name: "Virtual Intelligent Dev Team"
  short_description: "Route R&D, product, and governance work with bounded loops."
  # Keep this compact activation prompt in sync with skills-index.json.
  default_prompt: "Use $virtual-intelligent-dev-team for complex software work crossing implementation, architecture, product scope, UX, release readiness, Git workflow, or technical governance. Classify task shape and risk, then choose the smallest defensible workflow bundle with one semantic lead. Use quick-slice for narrow fixes, audit-fix-deliver for batched audit findings, pre-development planning for rewrites/migrations, bounded iteration for optimization loops, and the formal ship/hold gate for release questions. For code-facing routes, apply Team Engine Lite: Worker produces, Verifier independently checks, Lead accepts via DeliveryCycleReport. When the user explicitly asks for multi-agent execution, produce a controlled real subagent runtime plan; only upgrade from soft_orchestration_only when spawn/wait/merge evidence exists. Return one unified result with evidence, risks, next action, and resume anchor. All detailed protocols, agent catalog, routing rules, and workflow bundles are in references/ - use references/playbook-index.md and references/tooling-command-index.md for lookup."

  triggers:

    - "复杂开发任务"

    - "架构重构"

    - "技术治理"

    - "发布前 gate"

    - "研发协作"

    - "代码审查"
    - "virtual-intelligent-dev-team"