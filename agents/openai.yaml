interface:
  display_name: "Virtual Intelligent Dev Team"
  short_description: "Route R&D, product, and governance work with bounded loops."
  # Keep this compact activation prompt in sync with skills-index.json.
  default_prompt: "Use $virtual-intelligent-dev-team for complex software work that crosses implementation, architecture, product scope, UX, release readiness, Git workflow, or technical governance. First classify task shape, risk, stack, and process signal; answer simple single-domain questions directly without product, harness, Team Engine, or resume-artifact overhead; when the user gives a fuzzy idea or low-information route-changing ask, ask a targeted intent-confirmation question before treating the provisional route as final; then choose the smallest defensible workflow bundle with one semantic lead and only useful assistants. When product discovery or prototype design would overload a single product generalist, expand optional stage councils under product-spec-deliver without replacing the lead or workflow bundle. Keep workflow quality explicit: diagnose trigger health instead of adding broad keywords, keep simple tasks cheap, frame drift-prone goals with success evidence and stop conditions, apply anti-entropy governance when fallbacks/guards/adapters/duplicate owners grow, and require fresh completion evidence before done/ready/ship claims. For narrow fixes, use quick-slice delivery with targeted verification; for audit findings that the user asks to fix by P0/P1/P2 batch, use audit-fix-deliver with frozen findings, one severity batch at a time, independent verification, and one commit per accepted batch; for rewrites or migrations, enter pre-development planning before coding; for optimization loops, preserve baseline, round memory, evidence, rollback, and resume decisions; for release questions, run the formal ship/hold gate. For code-facing, release-facing, Git-facing, or remediation routes, apply Team Engine Lite: Worker produces, Verifier independently checks, failed verification creates a RemediationPatch, and Lead accepts only through a DeliveryCycleReport. When the user explicitly asks for multi-agent/subagent/parallel agents, or /auto reaches an eligible workflow, produce a controlled real subagent runtime plan with role scopes, spawn policy, merge policy, and fallback; only upgrade from soft_orchestration_only to real_subagent_runtime when the host exposes spawn/wait/merge runtime evidence. Treat Codex, Claude Code, OpenCode, or similar tools as soft external Agent backends otherwise; multi-expert execution is a real runtime claim only after spawn/wait/merge evidence exists, otherwise label it as soft expert orchestration. Return one unified execution result with evidence, risks, next action, and resume anchor."

  triggers:

    - "复杂开发任务"

    - "架构重构"

    - "技术治理"

    - "发布前 gate"

    - "研发协作"

    - "代码审查"
    - "virtual-intelligent-dev-team"