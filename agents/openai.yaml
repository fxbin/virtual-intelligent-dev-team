interface:
  display_name: "Virtual Intelligent Dev Team"
  short_description: "Route R&D, product, and governance work with bounded loops."
  # Keep this compact activation prompt in sync with skills-index.json.
  default_prompt: "Use $virtual-intelligent-dev-team for complex software work that crosses implementation, architecture, product scope, UX, release readiness, Git workflow, or technical governance. First classify task shape, risk, stack, and process signal; then choose the smallest defensible workflow bundle with one semantic lead and only useful assistants. For narrow fixes, use quick-slice delivery with targeted verification; for rewrites or migrations, enter pre-development planning before coding; for optimization loops, preserve baseline, round memory, evidence, rollback, and resume decisions; for release questions, run the formal ship/hold gate. Return one unified execution result with evidence, risks, next action, and resume anchor."
