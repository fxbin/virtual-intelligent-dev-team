schema_version: language-profiles/v1
skill_name: virtual-intelligent-dev-team

# Per-language context and constraint profiles used by the LLM to inject
# ecosystem defaults, idiomatic conventions, canonical verification commands,
# and language-specific guardrails. The router decision itself is still driven
# by `routing-rules.json → language_profiles`; this file only feeds the agent
# context after a profile is matched. Validate with `scripts/check_language_profiles.py`.

profiles:
  python:
    display_name: Python
    routing_keywords:
      - python
      - django
      - flask
      - fastapi
      - celery
      - gunicorn
      - uvicorn
      - pydantic
    ecosystem:
      web_framework: "FastAPI / Django / Flask"
      package_manager: "uv / pip / Poetry"
      async: "asyncio / AnyIO"
      validation: "Pydantic"
    conventions:
      - 类型标注优先，公共边界必须明确输入输出类型
      - FastAPI / Pydantic 场景优先使用 schema 校验而非手写字典约定
      - IO 密集任务使用 async 或后台队列，避免阻塞事件循环
      - 数据库访问必须明确事务边界和 N+1 风险
    verification:
      lint: "ruff check ."
      format: "ruff format --check ."
      type_check: "mypy ."
      test: "pytest"
    harness_constraints:
      - "公共 API 变更必须同步更新 schema / OpenAPI 与回归测试"
      - "异步代码不得在事件循环中执行阻塞 IO"
      - "数据库查询改动必须说明事务边界与 N+1 风险"

  go:
    display_name: Go
    routing_keywords:
      - go语言
      - golang
      - gin
      - fiber
      - go kit
      - gorm
      - grpc-go
    ecosystem:
      web_framework: "Gin / Fiber / net/http"
      orm: "GORM / sqlc"
      build: "go toolchain"
      rpc: "grpc-go"
    conventions:
      - context.Context 必须沿调用链传递取消和超时
      - 错误处理必须包装关键上下文，避免吞错
      - goroutine 必须有生命周期、取消和泄漏防护
      - 热路径改动优先附 benchmark 或 pprof 证据
    verification:
      lint: "golangci-lint run"
      test: "go test ./..."
      race: "go test -race ./..."
      benchmark: "go test -bench=. ./..."
    harness_constraints:
      - "新增 goroutine 必须说明退出条件和取消路径"
      - "对外 API / gRPC 变更必须同步更新契约与兼容性说明"
      - "并发或性能改动必须附 race / benchmark / pprof 中至少一种证据"

  nodejs:
    display_name: Node.js / TypeScript
    routing_keywords:
      - node
      - node.js
      - express
      - nestjs
      - koa
      - pm2
      - ts-node
      - typescript backend
    ecosystem:
      web_framework: "Express / NestJS / Koa"
      runtime: "Node.js LTS"
      package_manager: "pnpm / npm / yarn"
      language: "TypeScript"
    conventions:
      - TypeScript strict mode 优先，避免 any 泄漏到公共边界
      - API 输入输出使用 DTO / schema 校验
      - 异步错误必须进入统一错误处理链路
      - 后端服务需区分启动配置、运行时配置和 secret
    verification:
      lint: "pnpm lint"
      type_check: "pnpm typecheck"
      test: "pnpm test"
      build: "pnpm build"
    harness_constraints:
      - "公共 DTO / API contract 变更必须同步测试和客户端影响说明"
      - "禁止新增未捕获 Promise rejection 路径"
      - "认证、鉴权或配置改动必须标注 secret 与环境变量影响"

  rust:
    display_name: Rust
    routing_keywords:
      - rust
      - cargo
      - tokio
      - actix
      - axum
      - warp
      - rocket
      - serde
    ecosystem:
      web_framework: "Axum / Actix / Warp / Rocket"
      async: "Tokio"
      build: "Cargo"
      serialization: "Serde"
    conventions:
      - Result / Option 显式建模失败，不用 panic 处理可恢复错误
      - 所有权和生命周期改动必须说明共享/可变边界
      - async 任务必须明确取消、超时和 JoinHandle 处理
      - unsafe 代码必须局部化并写明不变量
    verification:
      lint: "cargo clippy --all-targets --all-features -- -D warnings"
      format: "cargo fmt -- --check"
      test: "cargo test --all-features"
      build: "cargo build --all-features"
    harness_constraints:
      - "禁止新增 unwrap / expect 处理外部输入或可恢复错误"
      - "新增 unsafe 必须说明安全不变量和测试覆盖"
      - "Tokio 并发改动必须说明取消、超时和资源释放路径"

  java:
    display_name: Java / JVM
    routing_keywords:
      - java
      - jdk
      - jvm
      - spring
      - spring boot
      - virtual thread
      - loom
    ecosystem:
      build: "Gradle / Maven"
      framework: "Spring Boot 3.x"
      jvm: "21+ (Virtual Threads)"
    conventions:
      - 优先使用 record 而非可变 POJO（数据载体）
      - 公共 API 变更必须同步更新 OpenAPI 契约与回归测试
      - 使用 java.time 替代 java.util.Date 与 Calendar
      - Stream.parallel() 必须有性能基准支撑
    verification:
      lint: "./gradlew checkstyleMain"
      test: "./gradlew test"
      coverage: "./gradlew jacocoTestReport"
      static_analysis: "./gradlew spotbugsMain"
    harness_constraints:
      - "Stream.parallel() 改动必须附性能基准"
      - "公共 API 变更必须同时更新 OpenAPI 契约与回归测试"
      - "JVM 调优建议必须标注 GC 算法与目标停顿时间"

  kotlin:
    display_name: Kotlin / JVM
    routing_keywords:
      - kotlin
      - ktor
      - exposed
      - kotlinx
      - gradle.kts
      - kotlin DSL
    ecosystem:
      web_framework: "Ktor / Spring"
      orm: "Exposed"
      build: "Gradle (Kotlin DSL)"
      async: "kotlinx.coroutines"
      serialization: "kotlinx.serialization"
    conventions:
      - 优先使用 data class 而非 POJO
      - 扩展函数优于 Util 类
      - 协程优于回调或 RxJava（除非已有存量）
      - sealed class/interface 用于受控状态建模
    verification:
      lint: "./gradlew ktlintCheck"
      test: "./gradlew test"
      coverage: "./gradlew jacocoTestReport"
      static_analysis: "./gradlew detekt"
    harness_constraints:
      - "新增公开 API 必须标注 @SinceKotlin 注解或等价机制"
      - "禁止使用 !! 强制解包（除非有不可达证明）"

  swift:
    display_name: Swift / Apple
    routing_keywords:
      - swift
      - swiftui
      - uikit
      - vapor
      - swiftpm
      - swift package manager
    ecosystem:
      ui_framework: "SwiftUI / UIKit"
      networking: "URLSession / Alamofire"
      package_manager: "Swift Package Manager"
      async: "Swift Concurrency (async/await)"
    conventions:
      - 优先 struct 而非 class，除非需要引用语义
      - 协议（Protocol）优先于继承
      - 使用 Result 类型处理错误，避免 throws 滥用
      - SwiftUI 视图保持纯函数式
    verification:
      lint: "swiftlint"
      test: "swift test"
      build: "swift build"
    harness_constraints:
      - "禁止在主 Actor 上执行耗时操作"
      - "@MainActor 标注 UI 入口点"

  cpp:
    display_name: C / C++
    routing_keywords:
      - cpp
      - "c++"
      - cmake
      - conan
      - vcpkg
      - clang
      - clang-tidy
    ecosystem:
      build: "CMake"
      package_manager: "vcpkg / Conan"
      standard: "C++20 及以上（若项目无历史包袱）"
    conventions:
      - RAII 优先，避免裸 new/delete
      - std::optional 优于 magic value 哨兵
      - std::span 优于原始指针+长度
      - Move 语义用于资源所有权转移
      - constexpr 优先于运行时计算
    verification:
      lint: "clang-tidy"
      test: "ctest"
      static_analysis: "clang-analyzer"
      sanitizers: "-fsanitize=address,undefined"
    harness_constraints:
      - "禁止 reinterpret_cast（除非硬件寄存器操作）"
      - "所有动态分配必须配合智能指针或明确的所有权文档"

  csharp:
    display_name: C# / .NET
    routing_keywords:
      - csharp
      - "c#"
      - dotnet
      - ".net"
      - asp.net
      - blazor
      - entity framework
    ecosystem:
      web_framework: "ASP.NET Core"
      orm: "Entity Framework Core"
      build: "dotnet CLI / MSBuild"
      async: "Task / async-await"
    conventions:
      - 优先使用 record 而非 class（不可变数据）
      - LINQ 优先于显式循环
      - 使用 primary constructor（C# 12+）
    verification:
      lint: "dotnet format"
      test: "dotnet test"
      build: "dotnet build"
    harness_constraints: []

  php:
    display_name: PHP
    routing_keywords:
      - php
      - laravel
      - symfony
      - composer
      - phpcs
      - phpstan
    ecosystem:
      web_framework: "Laravel / Symfony"
      package_manager: "Composer"
      async: "Swoole / ReactPHP（选配）"
    conventions:
      - 类型声明（PHP 8.x 全量）
      - 依赖注入优先于 Service Locator
      - Eloquent ORM 中避免 N+1 查询
    verification:
      lint: "phpcs"
      test: "phpunit"
      static_analysis: "phpstan"
    harness_constraints: []

  ruby:
    display_name: Ruby
    routing_keywords:
      - ruby
      - rails
      - ruby on rails
      - gem
      - bundler
      - rspec
      - sinatra
      - rubocop
    ecosystem:
      web_framework: "Ruby on Rails / Sinatra"
      package_manager: "Bundler"
      test: "RSpec / Minitest"
    conventions:
      - Fat Model Skinny Controller
      - Service Object 用于复杂业务逻辑
      - ActiveRecord 关系声明优于裸 SQL
    verification:
      lint: "rubocop"
      test: "bundle exec rspec"
      security: "bundle audit"
    harness_constraints: []

  elixir:
    display_name: Elixir / Phoenix
    routing_keywords:
      - elixir
      - phoenix
      - erlang
      - otp
      - ecto
      - liveview
      - mix
      - credo
    ecosystem:
      web_framework: "Phoenix"
      orm: "Ecto"
      build: "Mix"
      async: "OTP / GenServer / Task"
    conventions:
      - Let it crash — Supervisor 树优先
      - Pattern matching 优先于条件分支
      - Pipe operator 链式数据变换
      - Ecto Changeset 用于数据校验
    verification:
      lint: "mix credo"
      test: "mix test"
      static_analysis: "mix dialyzer"
    harness_constraints: []

  scala:
    display_name: Scala
    routing_keywords:
      - scala
      - play framework
      - akka
      - cats
      - zio
      - sbt
      - scalafix
    ecosystem:
      web_framework: "Play / http4s"
      functional: "Cats / ZIO"
      build: "sbt"
      async: "Future / IO / ZIO"
    conventions:
      - 不可变数据结构优先
      - for-comprehension 优于嵌套 flatMap
      - 密封特质（sealed trait）用于代数数据类型
    verification:
      lint: "scalafix"
      test: "sbt test"
      static_analysis: "sbt scalafix"
    harness_constraints: []
