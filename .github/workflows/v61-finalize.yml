name: Finalize Standalone v6.1

on:
  push:
    branches:
      - feature/1-field-tested-production-delivery
    paths:
      - .v61-finalize-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/1-field-tested-production-delivery
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Finalize standalone v6.1.0 metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          version = (root / 'VERSION').read_text(encoding='utf-8').strip()
          if version != 'v6.1.0':
              raise SystemExit(f'expected v6.1.0, got {version}')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = re.sub(r'(shields\.io/badge/version-)v[^-]+(-8b5cf6\?style=flat-square)', rf'\g<1>{version}\2', text, count=1)
          readme.write_text(text, encoding='utf-8')

          routing = root / 'references/routing-rules.json'
          rtext = routing.read_text(encoding='utf-8')
          rtext, count = re.subn(r'(?s)("meta"\s*:\s*\{.*?"version"\s*:\s*")[^"]+("\s*,)', rf'\g<1>{version}\2', rtext, count=1)
          if count != 1:
              raise SystemExit('routing-rules meta.version not found')
          json.loads(rtext)
          routing.write_text(rtext, encoding='utf-8')

          for filename in ('index.html', 'architecture.html', 'engineering.html', 'agents.html', 'matrix.html'):
              path = root / 'docs' / filename
              html = path.read_text(encoding='utf-8')
              html = re.sub(r'v\d+\.\d+\.\d+', version, html)
              path.write_text(html, encoding='utf-8')

          fixture_readme = root / 'tests/fixtures/export-parent/README.md'
          fixture_readme.write_text(fixture_readme.read_text(encoding='utf-8').replace('v6.0.19', version), encoding='utf-8')
          fixture_index = root / 'tests/fixtures/export-parent/skills-index.json'
          payload = json.loads(fixture_index.read_text(encoding='utf-8'))
          for item in payload.get('skills', []):
              if item.get('id') == 'virtual-intelligent-dev-team':
                  item['version'] = version
          fixture_index.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          skill_md = root / 'SKILL.md'
          stext = skill_md.read_text(encoding='utf-8')
          marker = '23. Produce one unified response instead of disconnected role fragments.'
          insertion = '''22.1. For production-bound changes that touch remote databases, managed functions, cloud deployment/configuration, hosted resources, or another external control plane, apply `references/production-bound-delivery-protocol.md`: verify canonical resource identity/capability before mutation, distinguish code/control/data-plane evidence, and fail closed on unverified remote work or migration-history drift.\n22.2. When several bounded PRs must integrate through a non-default release branch before one final default-branch release, apply `references/release-train-protocol.md`; the final release PR owns release-level closure, and child PR merge state must not be treated as proof of Issue auto-close or production rollout.\n22.3. After a material release/hotfix/phase transition, or before a broad new Epic when roadmap/Issue/resource truth may have drifted, apply `references/project-truth-reconciliation-protocol.md` so the next plan starts from reconciled runtime, repository, work-management, and decision truth.\n'''
          if '22.1. For production-bound changes' not in stext:
              if marker not in stext:
                  raise SystemExit('SKILL workflow marker not found')
              skill_md.write_text(stext.replace(marker, insertion + marker, 1), encoding='utf-8')

          notes = root / 'docs/release-notes.md'
          ntext = notes.read_text(encoding='utf-8')
          if '## v6.1.0 (2026-08-15)' not in ntext:
              section = '''## v6.1.0 (2026-08-15)\n\n- 基于 AhaFrame 真实端到端生产交付实测，而非假设流程，新增 `production-bound-delivery-protocol.md`：正式区分 code plane / control plane / production data plane，CI green 不再等价于 production green。\n- 远程 mutation 前强制先解析 provider/account/canonical resource ID 与实际 capability；区分宿主应用权限、OAuth/API scope、项目角色和资源策略，避免 stale resource ID 被误诊为权限问题。\n- 将 Human CLI execution 升级为一等 handoff/resume 模式：read/dry-run first、expected output、STOP conditions、secret boundary、mutation command、resume checkpoint 缺一不可。\n- migration-backed 系统新增 local/remote history drift fail-closed 规则；unexpected remote-only、历史版本对不齐或 dry-run 超出预期时禁止盲推。\n- 新增 `release-train-protocol.md`，明确 feature PR → release branch → final default-branch PR 的责任边界、Issue auto-close 语义、最终生产 gate 与 bounded hotfix。\n- 新增 presentation/semantic boundary：埋点、完成判定、权限/门禁和 workflow state 必须依赖稳定 semantic key / enum / data attribute，禁止依赖可本地化 visible text。\n- 新增 `project-truth-reconciliation-protocol.md`，在 release/hotfix/phase transition 后同步 runtime、default branch、Issues/PRs、roadmap/decision 与外部资源 ID，防止下一轮 AI/人类从陈旧计划启动。\n- Release Gate、Post-release Feedback、Pre-development Planning 与 Project Context 已接入上述规则；没有增加第七个 closure layer。\n- 新增 8 个 AhaFrame field-trial regression fixtures + deterministic checker + pytest locks，并增加 standalone / export-parent compatibility CI。\n- CI 实测同时守住独立仓与 canonical skill-hub 导出形态；保留 bounded-iteration 现有 zsh runtime prerequisite，本版不扩大为 shell runtime 重构。\n\n'''
              if '## v6.0.19' not in ntext:
                  raise SystemExit('release notes marker not found')
              notes.write_text(ntext.replace('## v6.0.19', section + '## v6.0.19', 1), encoding='utf-8')
          PY

      - name: Commit finalized standalone metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION README.md SKILL.md references/routing-rules.json docs tests/fixtures/export-parent
          if git diff --cached --quiet; then
            echo 'No metadata changes to commit.'
            exit 0
          fi
          git commit -m 'chore: finalize virtual-intelligent-dev-team v6.1.0'
          git push origin HEAD:feature/1-field-tested-production-delivery
